    this.initShakaPlayer();

      if (modal) modal.classList.add('show');

  disconnectedCallback() {
    if (this.animationFrameId) cancelAnimationFrame(this.animationFrameId);
    if (this.lockTimer) clearTimeout(this.lockTimer);
    if (this.shakaPlayer) this.shakaPlayer.destroy();

  }
  checkUnlockStatus() {
    const savedTime = localStorage.getItem('cricxcrate_unlocked_time');
    if (savedTime) {
      if (Date.now() - parseInt(savedTime, 10) < 24 * 60 * 60 * 1000) {
        this.isStreamUnlocked = true;
      } else {
        localStorage.removeItem('cricxcrate_unlocked_time');
      }
    }
  }

  triggerLock() {
    if (this.isStreamUnlocked) return;
    const video = this._shadow.getElementById('nativeVideoPlayer');
    if (video) video.pause();
    this._shadow.getElementById('tgInitialModal').classList.add('show');
  }

  unlockStream() {
    localStorage.setItem('cricxcrate_unlocked_time', Date.now().toString());
    this.isStreamUnlocked = true;
    this._shadow.getElementById('tgInitialModal').classList.remove('show');
    const video = this._shadow.getElementById('nativeVideoPlayer');
    if (video) video.play().catch(()=>{});
  }

  initEventListeners() {
    const btnShare = this._shadow.getElementById("btnShare");
    const tgJoinBtn = this._shadow.getElementById("tgJoinBtn");
    const tgJoinedBtn = this._shadow.getElementById("tgJoinedBtn");

    tgJoinBtn.addEventListener("click", () => this.unlockStream());
    tgJoinedBtn.addEventListener("click", () => this.unlockStream());

    const serverButtons = this._shadow.querySelectorAll('.server-btn');
    serverButtons.forEach(btn => {
      btn.addEventListener('click', (e) => {
        serverButtons.forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        const serverName = e.target.getAttribute('data-server');
        this.switchServer(serverName);
      });
    });

    const qualitySelect = this._shadow.getElementById('qualitySelect');
    qualitySelect.addEventListener('change', (e) => {
      const val = e.target.value;
      if (this.shakaPlayer) {
        if (val === 'auto') {
          this.shakaPlayer.configure({ abr: { enabled: true } });
        } else {
          this.shakaPlayer.configure({ abr: { enabled: false } });
          const tracks = this.shakaPlayer.getVariantTracks();
          const target = tracks.find(t => t.height === parseInt(val));
          if (target) this.shakaPlayer.selectVariantTrack(target, true);
        }
      }
    });

    btnShare.addEventListener("click", async () => {
      if (navigator.clipboard) {
        await navigator.clipboard.writeText(window.location.href);
        btnShare.textContent = "COPIED!";
        setTimeout(() => { btnShare.textContent = "SHARE STREAM"; }, 1800);
      }
    });
  }

  async initShakaPlayer() {
    const video = this._shadow.getElementById('nativeVideoPlayer');
    shaka.polyfill.install_all();
    if (!shaka.Player.isBrowserSupported()) return;

    this.shakaPlayer = new shaka.Player(video);
    this.shakaPlayer.configure({
      drm: {
        clearKeys: {
          [this.CONFIG.drmKeyId]: this.CONFIG.drmKey
        }
      }
    });

    this.shakaPlayer.addEventListener('error', (e) => console.error('Shaka Error:', e.detail));

    video.addEventListener('playing', () => {
      if (!this.isStreamUnlocked && !this.lockTimer) {
        this.lockTimer = setTimeout(() => this.triggerLock(), this.PREVIEW_TIME);
      }
    });

    await this.loadStreamUrl(this.CONFIG.servers["Alpha - Amazon"]);
  }

  async loadStreamUrl(url) {
    try {
      await this.shakaPlayer.load(url);
      console.log('Stream loaded successfully!');
      this.populateQualities();
    } catch (e) {
      console.error('Failed to load stream:', e);
    }
  }

  async switchServer(serverName) {
    const url = this.CONFIG.servers[serverName];
    if (url && this.shakaPlayer) {
      await this.loadStreamUrl(url);
    }
  }

  populateQualities() {
    const tracks = this.shakaPlayer.getVariantTracks();
    const qualitySelect = this._shadow.getElementById('qualitySelect');
    qualitySelect.innerHTML = '<option value="auto">Auto Quality</option>';
    
    const videoTracks = tracks.filter(t => t.type === 'variant' && t.height);
    const uniqueHeights = [...new Set(videoTracks.map(t => t.height))].sort((a, b) => b - a);

    uniqueHeights.forEach(height => {
      const option = document.createElement('option');
      option.value = height;
      option.textContent = `${height}p`;
      qualitySelect.appendChild(option);
    });
  }

  initWarpField() {
    const canvas = this._shadow.getElementById('warpGridCanvas');
    const ctx = canvas.getContext('2d');
    this.stars = [];
    const starCount = Math.min(120, Math.floor(window.innerWidth / 12));
    const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
    window.addEventListener('resize', resize);
    resize();

    for (let i = 0; i < starCount; i++) {
      this.stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        length: (Math.random() * 24 + 10) * this.SENSITIVITY * 0.8,
        speed: (Math.random() * 2.5 + 1.2) * this.SENSITIVITY,
        alpha: Math.random() * 0.5 + 0.15
      });
    }

    const render = () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.lineWidth = 1.2;
      this.stars.forEach(star => {
        ctx.strokeStyle = `rgba(0, 255, 204, ${star.alpha})`; 
        ctx.beginPath();
        ctx.moveTo(star.x, star.y);
        ctx.lineTo(star.x + star.length, star.y);
        ctx.stroke();
        star.x += star.speed;
        if (star.x > canvas.width) {
          star.x = -star.length;
          star.y = Math.random() * canvas.height;
        }
      });
      this.animationFrameId = requestAnimationFrame(render);
    };
    render();
  }

  initThemeSwitching() {
    const darkBtn = this._shadow.getElementById("themeDarkBtn");
    const lightBtn = this._shadow.getElementById("themeLightBtn");
    const setTheme = (mode) => {
      if (mode === "dark") {
        this.removeAttribute("data-theme");
        darkBtn.classList.add("active");
        lightBtn.classList.remove("active");
      } else {
        this.setAttribute("data-theme", "light");
        lightBtn.classList.add("active");
        darkBtn.classList.remove("active");
      }
    };
    darkBtn.addEventListener("click", () => setTheme("dark"));
    lightBtn.addEventListener("click", () => setTheme("light"));
  }
}

customElements.define('cricxcrate-ui', CricXCrateUI);
    </script>
</body>
