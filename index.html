<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sony Live Stream Player</title>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <style>
        body { 
            margin: 0; 
            background-color: #0b0b0b; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
        }
        .player-wrapper { 
            width: 100%; 
            max-width: 900px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border-radius: 8px;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <div class="player-wrapper">
        <video id="player" controls crossorigin playsinline muted></video>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15"></script>
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('player');
            
            // Aapka Sony wala m3u8 URL jo proxy ke through route hoga
            const streamUrl = "https://sonydaimenew.akamaized.net/hls/live/2094590/cricodi1809/TAM/std_lrh-800300010.m3u8?hdnea=exp=1789747035~acl=/*~id=85257464605952000924575211579778~hmac=94e2175eab0b98450236e44060c28f2045535837604668e0ebfc193418355714";
            const source = `${window.location.origin}/?url=${encodeURIComponent(streamUrl)}`;

            if (Hls.isSupported()) {
                const hls = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    backBufferLength: 30
                });

                hls.loadSource(source);
                hls.attachMedia(video);
                
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    const player = new Plyr(video, {
                        autoplay: true,
                        controls: ['play-large', 'play', 'progress', 'current-time', 'duration', 'mute', 'volume', 'settings', 'fullscreen']
                    });
                    
                    // User interaction ke baad audio un-mute karne ke liye optional handler
                    video.play().catch(() => {
                        console.log("Autoplay blocked, user interaction required.");
                    });
                });

                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                console.error("Network error encountered, trying to recover...");
                                hls.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                console.error("Media error encountered, trying to recover...");
                                hls.recoverMediaError();
                                break;
                            default:
                                console.error("Unrecoverable error, stopping HLS.");
                                hls.destroy();
                                break;
                        }
                    }
                });

            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // Safari / iOS native HLS support
                video.src = source;
                video.addEventListener('loadedmetadata', () => {
                    const player = new Plyr(video, { autoplay: true });
                    video.play();
                });
            }
        });
    </script>
</body>
</html>
