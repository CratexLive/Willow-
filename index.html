<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Player</title>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <style>
        body { margin: 0; background-color: #000; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .player-wrapper { width: 100%; max-width: 800px; }
    </style>
</head>
<body>
    <div class="player-wrapper">
        <video id="player" controls crossorigin playsinline muted></video>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15"></script>
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script>
        const video = document.getElementById('player');
        const streamUrl = "https://sonydaimenew.akamaized.net/hls/live/2105079/cricodi1809/HIN/std_lrh-800300010.m3u8?hdnea=exp=1789749461~acl=/*~id=58385575493512869088749323581865~hmac=ece70a90be50a345ad627087cdd87589b83bc3829a53b6494a8f62e39d4d0ab2";
        
        const sourceUrl = window.location.origin + "/api/proxy?url=" + encodeURIComponent(streamUrl);

        if (Hls.isSupported()) {
            const hls = new Hls({
                enableWorker: true,
                lowLatencyMode: true,
                backBufferLength: 30
            });

            hls.loadSource(sourceUrl);
            hls.attachMedia(video);
            
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                const player = new Plyr(video, {
                    autoplay: true,
                    controls: ['play-large', 'play', 'mute', 'volume', 'settings', 'fullscreen']
                });
                player.play();
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = sourceUrl;
            video.addEventListener('loadedmetadata', () => {
                const player = new Plyr(video, { autoplay: true });
                player.play();
            });
        }
    </script>
</body>
</html>
