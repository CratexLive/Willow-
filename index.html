  initEventListeners() {
    const btnShare = this._shadow.getElementById("btnShare");
    const shareBtnText = this._shadow.getElementById("shareBtnText");
    const streamTypeGroup = this._shadow.getElementById("streamTypeGroup");
    const serverGroup = this._shadow.getElementById("serverGroup");
    
    const initialModal = this._shadow.getElementById('tgInitialModal');
    const secondModal = this._shadow.getElementById('tgSecondModal');
    
    const tgJoinBtn1 = this._shadow.getElementById("tgJoinBtn1");
    const tgContinueBtn = this._shadow.getElementById("tgContinueBtn");
    
    const tgJoinBtn2 = this._shadow.getElementById("tgJoinBtn2");
    const modalCloseCross = this._shadow.getElementById("modalCloseCross");

    const handleContinue = () => {
      initialModal.classList.remove('show');
      setTimeout(() => {
        secondModal.classList.add('show');
      }, 2500);
    };

    tgJoinBtn1.addEventListener("click", () => {
      initialModal.classList.remove('show');
    });

    tgContinueBtn.addEventListener("click", handleContinue);

    const closeSecondModal = () => {
      secondModal.classList.remove('show');
    };

    tgJoinBtn2.addEventListener("click", closeSecondModal);
    modalCloseCross.addEventListener("click", closeSecondModal);

    streamTypeGroup.addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;
      streamTypeGroup.querySelectorAll("button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      this.CONFIG.currentQuality = btn.getAttribute("data-type");
      this.setupIframePlayer();
    });

    serverGroup.addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;
      serverGroup.querySelectorAll("button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      this.CONFIG.currentServer = btn.getAttribute("data-server");
      this.setupIframePlayer();
    });

    // Listen to iframe messages for auto-failover index shift across servers
    window.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'cricxcrate-server-fail') {
        this.switchToNextServer();
      }
    });

    btnShare.addEventListener("click", async () => {
      const shareData = {
        title: "Willow by CricXCrate — Match Stream",
        text: "Watch live match stream on Willow by CricXCrate!",
        url: window.location.href
      };
      try {
        if (navigator.share && /mobile|android|iphone|ipad|tablet/i.test(navigator.userAgent)) {
          await navigator.share(shareData);
        } else if (navigator.clipboard) {
          await navigator.clipboard.writeText(window.location.href);
          const originalText = shareBtnText.textContent;
          shareBtnText.textContent = "COPIED!";
          setTimeout(() => { shareBtnText.textContent = originalText; }, 1800);
        }
      } catch (err) {}
    });
  }

  switchToNextServer() {
    const servers = this.CONFIG.serverList;
    this.CONFIG.serverIndex = (this.CONFIG.serverIndex + 1) % servers.length;
    this.CONFIG.currentServer = servers[this.CONFIG.serverIndex];
    
    // Update active UI buttons visually
    const serverGroup = this._shadow.getElementById("serverGroup");
    if (serverGroup) {
      serverGroup.querySelectorAll("button").forEach(b => {
        if (b.getAttribute("data-server") === this.CONFIG.currentServer) {
          b.classList.add("active");
        } else {
          b.classList.remove("active");
        }
      });
    }

    console.log(`Auto-failover: Switching to ${this.CONFIG.currentServer}`);
    this.setupIframePlayer();
  }

  setupIframePlayer() {
    const iframe = this._shadow.getElementById('player');
    const quality = this.CONFIG.currentQuality;
    const server = this.CONFIG.currentServer;
    const streamUrl = this.STREAMS[quality][server];
    
    // Update server index tracker
    this.CONFIG.serverIndex = this.CONFIG.serverList.indexOf(server);

    const infoTitle = this._shadow.getElementById('streamInfoTitle');
    if (infoTitle) {
      const qualityName = quality === 'main' ? 'Main Stream' : 'Backup Stream';
      infoTitle.textContent = `Live Match Broadcast · ${qualityName} (${server})`;
    }

    iframe.srcdoc = `
      <!DOCTYPE html>
      <html lang="en">
      <head>
        <meta charset="utf-8">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@latest/dist/controls.css" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/shaka-player@latest/dist/shaka-player.ui.js" crossorigin="anonymous"><\/script>
        <style>
          body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
          .video-container { width: 100%; height: 100%; position: relative; }
          video { width: 100%; height: 100%; }
        </style>
      </head>
      <body>
        <div class="video-container" data-shaka-player-container>
          <video autoplay muted playsinline data-shaka-player id="video"></video>
        </div>
        <script>
          const manifestUri = '${streamUrl}';
          const keyId = '${this.DRM_CONFIG.keyId}';
          const keyValue = '${this.DRM_CONFIG.keyVal}';

          async function initPlayer() {
            shaka.polyfill.installAll();
            if (!shaka.Player.isBrowserSupported()) return;

            const video = document.getElementById('video');
            const ui = video.ui;
            const player = ui.getControls().getPlayer();

            const keys = {};
            keys[keyId] = keyValue;

            player.configure({
              streaming: { lowLatencyMode: true, bufferingGoal: 6, rebufferingGoal: 1 },
              drm: { clearKeys: keys, preferredKeySystems: ['org.w3.clearkey'] }
            });

            // Auto-Failover Error Listener
            player.addEventListener('error', (event) => {
              const err = event.detail;
              if (err.severity === shaka.util.Error.Severity.CRITICAL) {
                console.warn('Stream failed or server down, triggering auto-failover...', err);
                window.parent.postMessage({ type: 'cricxcrate-server-fail' }, '*');
              }
            });

            try {
              await player.load(manifestUri);
              if (player.isLive()) player.seek(player.seekRange().end);
              video.play().catch(() => {});
            } catch (e) {
              console.error('Error loading stream, switching server...', e);
              window.parent.postMessage({ type: 'cricxcrate-server-fail' }, '*');
            }
          }

          document.addEventListener('shaka-ui-loaded', initPlayer);
        <\/script>
      </body>
      </html>
    `;
  }

  initWarpField() {
    const canvas = this._shadow.getElementById('warpGridCanvas');
    const ctx = canvas.getContext('2d');
    this.stars = [];
    const starCount = Math.min(120, Math.floor(window.innerWidth / 12));
    const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
    window.addEventListener('resize', resize);
    resize();

    for (let i = 0; i < starCount; i++) {
      this.stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        length: (Math.random() * 24 + 10) * this.SENSITIVITY * 0.8,
        speed: (Math.random() * 2.5 + 1.2) * this.SENSITIVITY,
        alpha: Math.random() * 0.5 + 0.15
      });
    }

    const render = () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.lineWidth = 1.2;
      this.stars.forEach(star => {
        ctx.strokeStyle = `rgba(0, 255, 204, ${star.alpha})`; 
        ctx.beginPath();
        ctx.moveTo(star.x, star.y);
        ctx.lineTo(star.x + star.length, star.y);
        ctx.stroke();
        star.x += star.speed;
        if (star.x > canvas.width) {
          star.x = -star.length;
          star.y = Math.random() * canvas.height;
        }
      });
      this.animationFrameId = requestAnimationFrame(render);
    };
    render();
  }

  initThemeSwitching() {
    const darkBtn = this._shadow.getElementById("themeDarkBtn");
    const lightBtn = this._shadow.getElementById("themeLightBtn");
    const setTheme = (mode) => {
      if (mode === "dark") {
        this.removeAttribute("data-theme");
        darkBtn.classList.add("active");
        lightBtn.classList.remove("active");
      } else {
        this.setAttribute("data-theme", "light");
        lightBtn.classList.add("active");
        darkBtn.classList.remove("active");
      }
    };
    darkBtn.addEventListener("click", () => setTheme("dark"));
    lightBtn.addEventListener("click", () => setTheme("light"));
  }
}

customElements.define('cricxcrate-ui', CricXCrateUI);
    </script>
